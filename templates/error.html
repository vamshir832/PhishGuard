{% extends 'base.html' %}

{% block title %}PhishGuard | Request Error{% endblock %}

{% block content %}
<section class="content-card">
  <div class="eyebrow">Request could not be completed</div>
  <h1>Error {{ code }}</h1>
  <p>{{ message }}</p>
  <a class="primary-button" href="{{ url_for('index') }}">Return to PhishGuard</a>
</section>
{% endblock %}
